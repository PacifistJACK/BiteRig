name: Deploy BiteRig App to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Zip full app (backend + frontend) for deployment
        run: |
          mkdir -p build_deploy
          cp -r backend/* build_deploy/
          cp -r frontend build_deploy/frontend
          cd build_deploy
          zip -r ../deploy.zip . \
            --exclude "*.pyc" \
            --exclude "__pycache__/*" \
            --exclude ".env" \
            --exclude "data/*" \
            --exclude "test_*"

      - name: Deploy via Kudu ZipDeploy
        env:
          KUDU_USER: ${{ secrets.AZURE_KUDU_USERNAME }}
          KUDU_PASS: ${{ secrets.AZURE_KUDU_PASSWORD }}
        run: |
          curl -X POST \
            "https://biterig-api-a6e5fdbbdbf2dxha.scm.centralindia-01.azurewebsites.net/api/zipdeploy" \
            --user "${KUDU_USER}:${KUDU_PASS}" \
            --data-binary @deploy.zip \
            --header "Content-Type: application/octet-stream" \
            --max-time 300 \
            --retry 2 \
            --retry-delay 10 \
            --fail \
            --show-error