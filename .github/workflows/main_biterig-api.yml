name: Deploy Backend to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Zip backend for deployment
        run: |
          cd backend
          zip -r ../deploy.zip . \
            --exclude "*.pyc" \
            --exclude "__pycache__/*" \
            --exclude ".env" \
            --exclude "data/*" \
            --exclude "test_*"

      - name: Deploy via Kudu ZipDeploy
        env:
          KUDU_USER: ${{ secrets.AZURE_KUDU_USERNAME }}
          KUDU_PASS: ${{ secrets.AZURE_KUDU_PASSWORD }}
        run: |
          curl -X POST \
            "https://biterig-api-a6e5fdbbdbf2dxha.scm.centralindia-01.azurewebsites.net/api/zipdeploy" \
            --user "${KUDU_USER}:${KUDU_PASS}" \
            --data-binary @deploy.zip \
            --header "Content-Type: application/octet-stream" \
            --fail \
            --show-error