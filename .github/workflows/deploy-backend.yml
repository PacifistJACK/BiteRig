name: Deploy Backend to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Azure App Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Optional: run tests here ──────────────────────────────────────────

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          # The name of your Azure App Service (Web App)
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          # Download this from: Azure Portal → App Service → Deployment Center → Manage publish profile
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          # Only deploy the backend/ folder — not the whole repo
          package: './backend'
