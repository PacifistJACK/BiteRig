name: Deploy Backend to Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Azure App Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package backend folder into zip
        # zip the CONTENTS of backend/ so requirements.txt lands at root on Azure
        run: |
          cd backend
          zip -r ../deploy.zip . \
            --exclude "*.pyc" \
            --exclude "__pycache__/*" \
            --exclude ".env" \
            --exclude "data/*" \
            --exclude "test_*"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './deploy.zip'

