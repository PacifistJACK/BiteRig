name: Deploy Backend to Azure Container Registry

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  # ── Set these in your GitHub repository Secrets ──
  # AZURE_CREDENTIALS     : Service principal JSON (az ad sp create-for-rbac)
  # ACR_LOGIN_SERVER      : e.g. biterigacr.azurecr.io
  # ACR_USERNAME          : ACR admin username
  # ACR_PASSWORD          : ACR admin password
  # CONTAINER_APP_NAME    : e.g. biterig-api
  # CONTAINER_APP_RG      : Resource group name
  # GITHUB_TOKEN_SECRET   : Your GitHub AI token (stored as a Secret)
  IMAGE_NAME: biterig-api

jobs:
  build-and-deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push Docker image
        working-directory: backend
        run: |
          IMAGE_TAG=${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: ${{ secrets.CONTAINER_APP_NAME }}
          resourceGroup:    ${{ secrets.CONTAINER_APP_RG }}
          imageToDeploy:    ${{ env.IMAGE_TAG }}
          environmentVariables: |
            GITHUB_TOKEN=secretref:github-token
            ALLOWED_ORIGINS=${{ secrets.FRONTEND_URL }}

      - name: Azure logout
        run: az logout
